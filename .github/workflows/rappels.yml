name: Rappels

# Chaque matin : e-mails de fin d'essai ou d'abonnement (7 jours et 1 jour
# avant), envoyés par l'application. Ne dépend pas de l'hébergeur : la même
# tâche servira sur un autre serveur. Mise en place : README, « E-mails ».

on:
  schedule:
    # 7 h UTC = 8 h à Alger
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: rappels
  cancel-in-progress: false

jobs:
  rappels:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      CRON_SECRET: ${{ secrets.CRON_SECRET }}
      # Facultatif : adresse du site, https://www.tremplia.com par défaut
      APP_URL: ${{ secrets.APP_URL }}
    steps:
      - name: Envoyer les rappels du jour
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::warning::Rappels non configurés : secret CRON_SECRET manquant (README, section E-mails)"
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 120 \
            --retry 2 --retry-delay 30 --retry-all-errors \
            -X POST -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL:-https://www.tremplia.com}/api/cron/subscription-reminders"
