name: Sauvegarde

# Chaque nuit : base et fichiers de la production, dans une archive chiffrée
# envoyée sur un stockage compatible S3 (Backblaze B2). Le 1er du mois, la sauvegarde est aussi rangée
# dans mensuel/ et une restauration complète est vérifiée sur un Supabase
# local. Procédure et secrets : README, section « Sauvegardes ».

on:
  schedule:
    # 2 h UTC = 3 h à Alger
    - cron: "0 2 * * *"
  workflow_dispatch:
    inputs:
      verifier:
        description: "Vérifier aussi la restauration"
        type: boolean
        default: false

# Jamais deux sauvegardes en même temps
concurrency:
  group: sauvegarde
  cancel-in-progress: false

jobs:
  sauvegarder:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
      AWS_ACCESS_KEY_ID: ${{ secrets.BACKUP_S3_KEY_ID }}
      AWS_SECRET_ACCESS_KEY: ${{ secrets.BACKUP_S3_SECRET_KEY }}
      # Les stockages compatibles S3 (B2, R2…) ne gèrent pas toutes les
      # sommes de contrôle ajoutées par défaut par aws-cli
      AWS_REQUEST_CHECKSUM_CALCULATION: when_required
      AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
      BACKUP_S3_ENDPOINT: ${{ secrets.BACKUP_S3_ENDPOINT }}
      BACKUP_BUCKET: ${{ secrets.BACKUP_BUCKET }}
    steps:
      # Aucun secret : sauvegarde pas encore mise en place, rien à faire. Un
      # secret manquant parmi d'autres fait au contraire échouer la tâche.
      - name: Sauvegarde configurée ?
        id: config
        run: |
          if [ -z "$SUPABASE_DB_URL$SUPABASE_URL$SUPABASE_SECRET_KEY$AWS_ACCESS_KEY_ID$BACKUP_BUCKET" ]; then
            echo "::warning::Sauvegarde non configurée : voir la section Sauvegardes du README"
          else
            echo "active=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/checkout@v5
        if: steps.config.outputs.active == 'true'
      - uses: actions/setup-node@v5
        if: steps.config.outputs.active == 'true'
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        if: steps.config.outputs.active == 'true'
      - name: Outil de chiffrement
        if: steps.config.outputs.active == 'true'
        run: sudo apt-get update -q && sudo apt-get install -y -q age

      - name: Vérification ce mois-ci ?
        id: plan
        if: steps.config.outputs.active == 'true'
        run: |
          if [ "$(date -u +%d)" = "01" ] || [ "${{ inputs.verifier }}" = "true" ]; then
            echo "verifier=true" >> "$GITHUB_OUTPUT"
          fi
          echo "jour=$(date -u +%F)" >> "$GITHUB_OUTPUT"
          echo "mois=$(date -u +%Y-%m)" >> "$GITHUB_OUTPUT"

      # Pour la vérification, l'archive est aussi chiffrée pour une clé
      # jetable, créée ici et perdue à la fin de la tâche
      - name: Clé jetable de vérification
        if: steps.plan.outputs.verifier == 'true'
        run: |
          age-keygen -o "$RUNNER_TEMP/cle-verification.txt" 2> /dev/null
          echo "VERIFY_RECIPIENT=$(age-keygen -y "$RUNNER_TEMP/cle-verification.txt")" >> "$GITHUB_ENV"

      - name: Sauvegarde chiffrée
        if: steps.config.outputs.active == 'true'
        env:
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          BACKUP_AGE_RECIPIENT="$BACKUP_AGE_RECIPIENT ${VERIFY_RECIPIENT:-}" \
            scripts/backup/backup.sh "$RUNNER_TEMP/sauvegarde.tar.gz.age"

      - name: Envoi de l'archive
        if: steps.config.outputs.active == 'true'
        run: |
          # Un espace ou un retour à la ligne collé avec un secret le rend invalide
          clean() { printf '%s' "$1" | tr -d '[:space:]'; }
          export AWS_ACCESS_KEY_ID="$(clean "$AWS_ACCESS_KEY_ID")"
          export AWS_SECRET_ACCESS_KEY="$(clean "$AWS_SECRET_ACCESS_KEY")"
          BACKUP_S3_ENDPOINT="$(clean "$BACKUP_S3_ENDPOINT")"
          BACKUP_BUCKET="$(clean "$BACKUP_BUCKET")"
          # Contrôle de forme, sans rien révéler : une clé d'application B2
          # a un keyID de 25 caractères et une applicationKey de 31
          echo "keyID : ${#AWS_ACCESS_KEY_ID} caractères, applicationKey : ${#AWS_SECRET_ACCESS_KEY} caractères"
          case "$BACKUP_S3_ENDPOINT" in
            https://*) ;;
            *) echo "::error::BACKUP_S3_ENDPOINT doit commencer par https://"; exit 1 ;;
          esac
          # B2 signe avec la région de son adresse (s3.<région>.backblazeb2.com)
          region="$(echo "$BACKUP_S3_ENDPOINT" | sed -nE 's#^https://s3\.([^.]+)\.backblazeb2\.com.*#\1#p')"
          export AWS_DEFAULT_REGION="${region:-auto}"
          archive="$RUNNER_TEMP/sauvegarde.tar.gz.age"
          aws s3 cp "$archive" "s3://$BACKUP_BUCKET/quotidien/${{ steps.plan.outputs.jour }}.tar.gz.age" \
            --endpoint-url "$BACKUP_S3_ENDPOINT" --only-show-errors
          if [ "$(date -u +%d)" = "01" ]; then
            aws s3 cp "$archive" "s3://$BACKUP_BUCKET/mensuel/${{ steps.plan.outputs.mois }}.tar.gz.age" \
              --endpoint-url "$BACKUP_S3_ENDPOINT" --only-show-errors
          fi
          echo "Envoyé : quotidien/${{ steps.plan.outputs.jour }}.tar.gz.age"
          # Ce que le bucket contient réellement (date, taille, nom)
          echo "Contenu du bucket :"
          aws s3 ls "s3://$BACKUP_BUCKET/" --recursive --human-readable \
            --endpoint-url "$BACKUP_S3_ENDPOINT"

      # Restauration complète sur un Supabase local vide (sans migrations),
      # comme sur un projet neuf, puis contrôle table par table
      - name: Vérification de la restauration
        if: steps.plan.outputs.verifier == 'true'
        run: |
          rm -rf supabase/migrations
          npx supabase start
          eval "$(npx supabase status -o env 2> /dev/null | grep -E '^(API_URL|SECRET_KEY)=')"
          SUPABASE_DB_URL="postgresql://postgres:postgres@127.0.0.1:5432/postgres" \
          SUPABASE_URL="$API_URL" SUPABASE_SECRET_KEY="$SECRET_KEY" \
          PSQL="docker exec -i supabase_db_tremplia psql -U postgres -h 127.0.0.1" \
            scripts/backup/restore.sh "$RUNNER_TEMP/sauvegarde.tar.gz.age" "$RUNNER_TEMP/cle-verification.txt"
